- name: Get Lists of VMs
  slurp:
    src: "{{ vm_inventory }}"
  register: vm_list_content

- name: Update variable for each host
  set_fact:
   vms: "{{ vms }} {{ item }}"
  loop: "{{ vm_list_content['content'] | b64decode | from_yaml }}"
  when: vm_list_content['content'] is defined

- name: Update Tags
  vmware_tag_manager:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: no
    tag_names: 
     - "{{ tag_name }}"
    object_name: "{{ vm_name }}"
    object_type: VirtualMachine
    state: add
  register: tag
  delegate_to: localhost
