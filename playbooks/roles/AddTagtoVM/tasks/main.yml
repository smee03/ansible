- name:
  vmware_tag_manager:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: no
    tag_names: 
     - "{{ tag_name }}"
    object_name: "{{ vm_name }}"
    object_type: VirtualMachine
    state: add
  register: tag
  delegate_to: localhost
- debug:
   var: tag
