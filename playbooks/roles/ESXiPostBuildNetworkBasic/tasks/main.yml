    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    esxi_hostname: '{{ esxi_hostname }}'
    dvswitch_name: "{{ dvswitch_name }}"
    portgroup_name: "{{ vmks_vmotion_dhcp_portgroup_name }}"
    validate_certs: false
