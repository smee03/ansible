- name: Migrate Management vmk0
  vmware_migrate_vmk:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    esxi_hostname: "{{ esxi_hostname }}"
    validate_certs: false
    device: vmk0
    current_switch_name: vSwitch0
    current_portgroup_name: "Management Network"
    migrate_switch_name: "{{ dvswitch_name }}"
    migrate_portgroup_name: "{{ mgmt_portgroup }}"
  delegate_to: localhost

- name: Delete a vSwitch0
  vmware_vswitch:
    hostname: "{{ esxi_hostname }}"
    username: root
    password: "{{ default_esxi_root_password }}"
    esxi_hostname: "{{ esxi_hostname }}"
    validate_certs: false
    switch_name: vSwitch0
    state: absent
  register: delete_vswitch
  delegate_to: localhost

- name: Delete a vSwitch0 if using custom ssh
  vmware_vswitch:
    hostname: "{{ esxi_hostname }}"
    username: root
    password: "{{ ssh_user_password }}"
    esxi_hostname: "{{ esxi_hostname }}"
    validate_certs: false
    switch_name: vSwitch0
    state: absent
  delegate_to: localhost
  when: delete_vswitch.failed

- name: Configure TCP/IP Provisioning, vmotion
  community.vmware.vmware_host_tcpip_stacks:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: false
    esxi_hostname: "{{ esxi_hostname }}"
    provisioning:
      congestion_algorithm: newreno
      max_num_connections: 11000
    vmotion:
      congestion_algorithm: newreno
      max_num_connections: 11000
  register: tcpipstack
  delegate_to: localhost
