## Enable SSH ##
- name: Enable sshd services for ESXi
  vmware_host_service_manager:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    esxi_hostname: "{{ esxi_hostname }}"
    validate_certs: false
    service_name: TSM-SSH
    state: start
  register: sshdenable
  delegate_to: localhost

- name: Creating a new dvswitch if requested
  vmware_dvswitch:
    hostname: '{{ vcenter_hostname }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    datacenter: '{{ datacenter }}'
    switch: "{{ dvswitch_name }}"
    version: "{{ switch_version }}"
    mtu: 9000
    uplink_quantity: 8
    multicast_filtering_mode: snooping
    discovery_protocol: cdp
    discovery_operation: both
    state: present
    validate_certs: false
  when: "new_dvswitch == 'yes'"
  delegate_to: localhost

- name: Add dvSwitch to host
  vmware_dvs_host:
   hostname: '{{ vcenter_hostname }}'
   username: '{{ vcenter_username }}'
   password: '{{ vcenter_password }}'
   esxi_hostname: "{{ esxi_hostname }}"
   switch_name: "{{ dvswitch_name }}"
   validate_certs: false
  register: dvswitch
  delegate_to: localhost

- name: Get Port ID for Uplink1
  shell: esxcfg-vswitch -l | awk 'NR==13{print $1; exit}'
  register: getportID1
- set_fact:
        portID1: "{{ getportID1.stdout | replace(\"'\",'') }}"

- name: add vmnic1 to uplink1
  shell: esxcfg-vswitch -P vmnic1 -V '{{ portID1 }}' "{{ dvswitch_name }}"
  register: addvmnic

- name: Get Port ID for Uplink2
  shell: esxcfg-vswitch -l | awk 'NR==14{print $1; exit}'
