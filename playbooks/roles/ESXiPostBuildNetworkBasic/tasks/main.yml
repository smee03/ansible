- name: Add vMotion vmkernel1 port with vMotion TCP/IP stack
  vmware_vmkernel:
    hostname: '{{ vcenter_hostname }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    esxi_hostname: '{{ esxi_hostname }}'
    dvswitch_name: "{{ dvswitch_name }}"
    portgroup_name: "{{ vmks_vmotion_dhcp_portgroup_name }}"
    validate_certs: false
    device: vmk1
    network:
      type: 'dhcp'
      tcpip_stack: vmotion
    state: present
  delegate_to: localhost
  register: vmk1

- name: Add vMotion vmkernel2 port with vMotion TCP/IP stack
  vmware_vmkernel:
    hostname: '{{ vcenter_hostname }}'
    username: '{{ vcenter_username }}'
    password: '{{ vcenter_password }}'
    esxi_hostname: '{{ esxi_hostname }}'
    dvswitch_name: "{{ dvswitch_name }}"
    portgroup_name: "{{ vmks_vmotion_dhcp_portgroup_name }}"
    validate_certs: false
    device: vmk2
    network:
      type: 'dhcp'
      tcpip_stack: vmotion
    state: present
  delegate_to: localhost
  register: vmk2

- name: Add vMotion vmkernel3 port with vMotion TCP/IP stack
  vmware_vmkernel:
