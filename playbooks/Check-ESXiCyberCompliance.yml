---
- name: ESXi Cyber Compliance Check - from USH
  hosts: all
  gather_facts: no
  ignore_errors: true
  serial: 1
  connection: local
  vars:
    ansible_python_interpreter: /bin/python3
  tasks:
    - include_tasks: ../roles/Check-ESXiCyberCompliance/tasks/CheckConnection.yml

    - name: Check ESXi Cyber Compliance
      include_role:
        name: Check-ESXiCyberCompliance
      when: connectivity_check != 'notResponding'
